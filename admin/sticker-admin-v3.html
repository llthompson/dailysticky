<!-- Admin interface for managing the Daily Sticky database including stickers and artists -->
<!-- To prevent html from reloading with every change, run 
 python3 -m http.server 8000
 in the terminal and then load 
  http://localhost:8000/admin/sticker-admin-v3.html
 in your browser. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Sticky</title>
    <style>
      :root {
        --bg: #f7f3f6;
        --panel: #ffffff;
        --border: #e2e0da;
        --ink: #26231c;
        --muted: #857f72;
        --accent: #7f77dd;
        --accent-ink: #3c3489;
        --danger: #d85a30;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
      }

      header .status {
        font-size: 12px;
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        gap: 8px;
      }

      button {
        font: inherit;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        cursor: pointer;
      }

      button:hover {
        background: #f0efe9;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      button.primary:hover {
        background: var(--accent-ink);
      }

      button.danger {
        color: var(--danger);
        border-color: var(--danger);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 70vh;
        gap: 12px;
        color: var(--muted);
      }

      #dropzone input[type="file"] {
        display: none;
      }

      #app {
        display: none;
        height: calc(100vh - 49px);
      }
      #app.visible {
        display: flex;
      }

      .sidebar {
        width: 340px;
        min-width: 340px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        transition:
          width 0.2s ease,
          min-width 0.2s ease;
      }

      .sidebar.collapsed {
        width: 48px;
        min-width: 48px;
      }

      .sidebar-controls {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .search-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .search-row input {
        min-width: 0;
        flex: 1 1 auto;
      }

      .scope-chip {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }

      .scope-chip.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .sidebar-toggle {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        flex-shrink: 0;
        font-size: 18px;
        line-height: 1;
      }

      .sidebar.collapsed .sidebar-controls {
        padding: 10px 8px;
        border-bottom: 0;
      }

      .sidebar.collapsed .search-row {
        justify-content: center;
      }

      .sidebar.collapsed .search-row input,
      .sidebar.collapsed .search-row select,
      .sidebar.collapsed .scope-chip,
      .sidebar.collapsed .filter-row,
      .sidebar.collapsed .sticker-list {
        display: none;
      }

      input[type="text"],
      input[type="search"],
      input[type="password"],
      select,
      textarea {
        font: inherit;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        width: 100%;
      }

      .filter-row {
        display: flex;
        gap: 6px;
      }

      .filter-row select {
        width: auto;
        flex: 1;
      }

      .bulk-select-row {
        align-items: center;
      }

      .select-all-label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        white-space: nowrap;
      }

      .bulk-select-row #bulkEditSelectedBtn {
        flex: 1;
      }

      .sticker-list {
        flex: 1;
        overflow-y: auto;
      }

      .sticker-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }

      .sticker-row:hover {
        background: #f5f4f0;
      }
      .sticker-row.active {
        background: #eeedfb;
      }

      .sticker-row .thumb {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: var(--muted);
        flex-shrink: 0;
        overflow: hidden;
      }

      .sticker-row .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .sticker-row .meta {
        min-width: 0;
        flex: 1;
      }
      .sticker-row .meta .name {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sticker-row .meta .sub {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        flex-shrink: 0;
      }

      .badge.review {
        background: var(--danger);
      }
      .badge.inactive {
        background: var(--muted);
      }

      .main {
        flex: 1;
        overflow-y: auto;
        padding: 9px 9px;
      }

      .main .empty {
        color: var(--muted);
        text-align: center;
        margin-top: 80px;
      }

      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.02em;
        margin-bottom: 5px;
      }

      .field .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .toggles {
        display: flex;
        gap: 20px;
      }

      .toggles label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        cursor: pointer;
      }

      optgroup {
        font-weight: 600;
      }

      .form-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        max-width: 640px;
        flex-shrink: 0;
      }

      .edit-layout {
        display: flex;
        gap: 9px;
        align-items: flex-start;
      }

      .sticker-preview {
        position: sticky;
        top: 22px;
        flex: 1;
        min-width: 0;
        text-align: center;
      }

      .sticker-preview-img {
        width: 100%;
        height: calc(100vh - 190px);
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
      }

      .sticker-preview-img img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .sticker-preview-label {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .form-card h2 {
        font-size: 15px;
        margin: 0 0 18px;
      }

      .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .form-actions .right {
        display: flex;
        gap: 8px;
      }

      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .toast.show {
        opacity: 1;
      }

      #artistPanel {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .artist-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .artist-row span {
        flex: 1;
        font-size: 13px;
      }
      .artist-row button {
        padding: 4px 10px;
        font-size: 12px;
      }

      .artist-name-link {
        cursor: pointer;
        color: var(--accent-ink);
        font-weight: 500;
      }

      .artist-name-link:hover {
        text-decoration: underline;
      }

      .artist-sticker-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
        gap: 10px;
      }

      .artist-sticker-tile {
        cursor: pointer;
        text-align: center;
      }

      .artist-sticker-tile .thumb {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .artist-sticker-tile .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .artist-sticker-name {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bulk-wrap {
        max-width: 100%;
      }

      .bulk-dropzone {
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }

      .bulk-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 0;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .bulk-toolbar select {
        width: auto;
        min-width: 140px;
      }
      .bulk-toolbar .sep {
        color: var(--border);
      }

      .bulk-folder-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
      }

      .bulk-folder-status button {
        padding: 5px 12px;
        font-size: 12px;
      }

      .bulk-table-wrap {
        overflow-x: auto;
      }

      table.bulk-table {
        border-collapse: collapse;
        width: 100%;
        background: var(--panel);
      }

      table.bulk-table th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      table.bulk-table td {
        padding: 4px 6px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      table.bulk-table input[type="text"],
      table.bulk-table select {
        padding: 5px 7px;
        font-size: 13px;
        min-width: 110px;
      }

      /* table.bulk-table input[data-field="tags"] {
        min-width: 220px;
      } */

      .tag-resize-wrap {
        display: inline-block;
        resize: horizontal;
        overflow: hidden;
        min-width: 110px;
        max-width: 100%;
      }

      .tag-resize-wrap input[data-field="tags"] {
        width: 100%;
        height: 100%;
        min-width: 0;
      }

      table.bulk-table .thumb {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        overflow: hidden;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      table.bulk-table .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      table.bulk-table tr:has(input[type="text"]:focus) .thumb img {
        /* temp for formatting */
        /* table.bulk-table tbody tr:first-child .thumb img { */
        position: fixed;
        top: 24px;
        left: 42px;
        width: 200px;
        height: 200px;
        padding: 0;
        object-fit: contain;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 12px 35px rgba(38, 35, 28, 0.22);
        z-index: 9000;
        /* pointer-events: none; */
        pointer-events: auto;
      }

      table.bulk-table .remove-row {
        padding: 4px 9px;
        font-size: 11px;
      }

      table.bulk-table td:nth-child(9) {
        width: 32px !important;
        max-width: 32px !important;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Admin Sticky</h1>
      <div class="toolbar">
        <span class="status" id="statusText"></span>
        <button id="addStickerBtn" disabled>+ Add sticker</button>
        <button id="manageArtistsBtn" disabled>Artists</button>
        <button id="bulkImportBtn" disabled>Bulk import</button>
        <button class="primary" id="downloadBtn" disabled>Download .db</button>
      </div>
    </header>

    <div id="dropzone">
      <p>Load your stickers.db to get started</p>
      <label>
        <button onclick="document.getElementById('fileInput').click()">
          Choose file
        </button>
        <input type="file" id="fileInput" accept=".db" />
      </label>
    </div>

    <div id="app">
      <div class="sidebar" id="stickerSidebar">
        <div class="sidebar-controls">
          <div class="search-row">
            <input
              type="search"
              id="searchInput"
              placeholder="Search name, tag, or id"
            />
            <button
              type="button"
              class="scope-chip"
              id="scopeNameBtn"
              data-scope="name"
              title="Search names"
              aria-pressed="false"
            >
              N
            </button>
            <button
              type="button"
              class="scope-chip"
              id="scopeTagsBtn"
              data-scope="tags"
              title="Search tags"
              aria-pressed="false"
            >
              T
            </button>
            <button
              type="button"
              class="sidebar-toggle"
              id="sidebarToggleBtn"
              aria-controls="stickerSidebar"
              aria-expanded="true"
              aria-label="Collapse sticker selector"
              title="Collapse sticker selector"
            >
              ‹
            </button>
          </div>
          <div class="filter-row">
            <select id="tabFilter">
              <option value="">All tabs</option>
              <option value="feelings">My Feelings</option>
              <option value="world">My World</option>
            </select>
            <select id="categoryFilter">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="statusFilter">
              <option value="">Active</option>
              <option value="review">Needs review</option>
              <option value="inactive">Inactive</option>
              <option value="artist">Artist stickers</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="artistFilter">
              <option value="">All artists</option>
            </select>
          </div>
          <div class="filter-row bulk-select-row">
            <label class="select-all-label">
              <input type="checkbox" id="selectAllVisibleCheck" /> All
            </label>
            <button id="bulkEditSelectedBtn" disabled>
              Bulk edit selected (0)
            </button>
            <button id="clearBulkEditBtn" disabled>Clear</button>
          </div>
        </div>
        <div class="sticker-list" id="stickerList"></div>
      </div>

      <div class="main" id="mainPanel">
        <div class="empty">
          Select a sticker from the list, or add a new one.
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
      const CATEGORIES = {
        feelings: [
          "Joy & Fun",
          "Calm & Peace",
          "Love & Connection",
          "Sad & Down",
          "Stressed & Anxious",
          "Angry & Frustrated",
          "Tired & Drained",
          "Confused & Mixed",
        ],
        world: [
          "People & Body",
          "Animals & Nature",
          "Food & Drink",
          "Travel & Places",
          "Activities",
          "Objects",
        ],
      };

      // Ported from tag-stickers.py's SYSTEM_PROMPT (condensed).
      // Kept in-memory only — never written to stickers.db, never persisted.
      let anthropicApiKey =
        localStorage.getItem("dailysticky_admin_ai_key") || "";

      const AI_SUGGEST_SYSTEM_PROMPT = `You are labeling a sticker from a digital journaling app. Look at the image and return ONLY valid JSON, no other text, no markdown fences, matching this exact schema:

{
  "id": "<sticker id, provided to you>",
  "observedDetails": "2-4 short phrases naming exactly what you see: subject/species or object identity, pose or action, exact colors, any distinguishing accessory or detail, expression if a face is shown. Literal observation only, no interpretation. This field is discarded and never shown to anyone — its only purpose is to make you look closely before you write name/tags.",
  "name": "literal visual descriptive name, 2-5 words, plain language",
  "tags": ["3 to 5 lowercase single or short-phrase tags"],
  "primaryCategory": "<one category from the list below>",
  "secondaryCategory": "<one category from the list below, or null if it doesn't clearly fit a second one>",
  "needsReview": false
}

Framing: this sticker will sit in a set with hundreds of others in a daily journaling app. Fill in observedDetails as if you were describing the image to someone who cannot see it, using only what's in front of you. Then ask yourself: if there were five similar stickers next to this one, what specific, visible detail would let someone tell this one apart? Lead the name and tags with that detail, not with the safest word that could describe any of the five.

Specificity rule: when a more specific, identifiable term is visible, use it instead of the generic category-level word. A daisy is a "daisy," not a "flower." A corgi is a "corgi," not a "dog." A cup with a tea bag string is "mug of tea," not "drink." Only fall back to a generic term if the image genuinely doesn't support anything more specific.

BANNED WORDS — hard constraint, check this before you answer: never use "cute", "kawaii", "sticker", "happy", "stickers", "character", "baby", "cute character", "kawaii style", "kawaii character", "stylized", or any of those words in combination with other words in the name or tags. These words are banned even when they feel like the most natural or accurate descriptor — if your first instinct is one of these words, that is the signal to look harder at the image and find a more specific, literal alternative instead.

You will also be given the sticker's OLD category as context. Treat this as a hint only, not a rule — the image itself should always drive your actual category choice. Old categories often contain stickers that belong to a different new category than the hint suggests (e.g. a stressed face filed under "Working" should be categorized by the expression, not the old label).

Old category -> new category hints:
- Adulting, Appointments, Books, Cleaning, Health, Money, School, Shopping, Working, Writing, Holiday -> Objects
- Exercise -> Activities
- Fun -> Objects or Activities
- Food All, Food Beverages, Food Desserts, Food Fruits Veggies -> Food & Drink
- Nature, Seasons, Pets -> Animals & Nature
- Places, Travel -> Travel & Places
- Animal Vibes, Emoticon A, Emoticon B, Emoticon C, Emoticon Xtra, People Women, Words, Love, Mental Health (relax), Pride -> Internal World (pick the specific emotion family below)
- Objects -> Objects

If the old category is an "Internal World" hint, you must still choose one specific emotion family — never output "Internal World" itself.

Categories:

Internal World (emotion families) — use when the sticker's primary content is a facial expression, mood, feeling-word, or emotionally-toned illustration (including stylized animals or people whose main purpose is conveying a vibe/feeling). These category labels are for classification only — do not copy their wording into the name or tags:
- Joy & Fun — delighted, gleeful, playful, excited, amused, good mood, good, amazing, great, fantastic, wonderful, awesome
- Calm & Peace — relaxed, cozy, content, at ease, chill, serene, meditative, peaceful, calm
- Love & Connection — affection, warmth, closeness, gratitude, friendship, love, caring, supportive, together
- Sad & Down — low, blue, disappointed, lonely, depressed, gloomy, sad, down, unhappy
- Stressed & Anxious — overwhelmed, worried, nervous, panicked, tense, pressured, stressed, freaked out, anxious, anxiety
- Angry & Frustrated — irritated, mad, annoyed, fed up, grumpy, angry, pissed, rage, kill, upset, over it, furious, frustrated
- Tired & Drained — exhausted, burnt out, sleepy, low energy, overwhelmed, worn out, fatigued, dead, done, over it
- Confused & Mixed — numb, meh, uncertain, "don't know how I feel", idk, okay, fine, mixed, conflicted, ambivalent, unsure, confused, lost, disoriented

External World (literal content) — use when the sticker's primary content is a concrete object, place, activity, or literal (non-mood-focused) depiction of a person/animal:
- People & Body — literal human figures/body parts not primarily conveying an emotion
- Animals & Nature — literal animals, plants, weather, outdoors (not stylized "vibe" animals — those go to Internal World or Activities)
- Food & Drink
- Travel & Places — landmarks, vehicles, luggage, maps, passports, road trips, beaches, mountains, cities
- Activities — sports, hobbies, events, celebrations, games, crafts, dancing, cooking, gardening, music, exercise, workout, work, business
- Objects — household items, tools, money, tech, books, work/school items, furniture, appliances, stationery

Rules:
- Exactly one primaryCategory. secondaryCategory only if a second category genuinely applies (e.g. a "coffee with a friend" scene could be Love & Connection primary, Food & Drink secondary).
- Stylized/expressive animals, people, or word/phrase stickers meant to convey a mood belong in an Internal World category — sort by the feeling they convey.
- Tags should describe what's visually there AND/OR the mood it evokes — whichever is more useful for someone searching later. Ground each tag in something specific to this image (pose, object, color, expression, setting) — do not fall back on a generic mood word that could apply to dozens of other stickers.
- Set "needsReview": true (and still fill in your best guess for every other field) if the image is abstract, ambiguous, or you are not confident in the category assignment.
- The name must describe only what is literally visible: the subject, object, action, pose, or physical detail. Do not use inferred emotion, feeling, mood, personality, or vibe words in the name. For example, use "cat with tears" instead of "sad cat", "smiling face" instead of "happy face", and "person holding head" instead of "stressed person". Emotion and feeling words may still be used in tags and should still guide the category choice.
- If the sticker contains clearly readable text, use that text as the sticker name. If the text is long, truncate to 2-5 words, prioritizing meaningful nouns, verbs, adverbs, and adjectives. Preserve the original wording, but normal capitalization is fine. If the text is not clearly readable, use a short descriptive name instead.
- If the sticker contains any clearly readable text, always include "text" and "words" as tags.

      async function convertToWebp(file, maxDim = 512, quality = 0.85) {
        const bitmap = await createImageBitmap(file, {
          resizeWidth: maxDim,
          resizeQuality: "medium",
        });

        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext("2d").drawImage(bitmap, 0, 0);
        bitmap.close();

        return new Promise((resolve) =>
          canvas.toBlob(resolve, "image/webp", quality),
        );
      }

      function slugify(filename) {
        const base = filename.replace(/\.[^.]+$/, "");
        return base
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-+|-+$)/g, "");
      }

      function uniqueId(base) {
        const taken = new Set([
          ...stickerCache.map((s) => s.id),
          ...bulkRows.map((r) => r.id),
        ]);
        let candidate = base;
        let n = 2;
        while (taken.has(candidate)) {
          candidate = `${base}-${n}`;
          n++;
        }
        return candidate;
      }

            wraps.forEach((w) => {

      async function commitBulkImport() {
        const ids = bulkRows.map((r) => r.id);
        const dupWithinBatch = ids.some((id, i) => ids.indexOf(id) !== i);

        if (dupWithinBatch) {
          showToast("Duplicate IDs in this batch — fix before adding");
          return;
        }

        const missingPrimary = bulkRows.some((r) => !r.primary);
        if (missingPrimary) {
          showToast("Every sticker needs a primary category");
          return;
        }

        const existingIds = new Set(stickerCache.map((s) => s.id));
        const collidesWithDb = bulkRows.some((r) => existingIds.has(r.id));
        if (collidesWithDb) {
          showToast("An ID already exists in the database — fix before adding");
          return;
        }

        const btn = $("bulkCommitBtn");
        btn.disabled = true;
        btn.textContent = "Converting and saving…";

        let zip = null;

        if (supportsFSAccess) {
          if (!stickerDirHandle) {
            const chose = await requestStickerDirectory();
            if (!chose) {
              btn.disabled = false;
              btn.textContent = "Add all to database";
              showToast("Folder selection cancelled");
              return;
            }
          }
        } else {
          zip = new JSZip();
        }

        const succeeded = [];
        const failed = [];

        for (const r of bulkRows) {
          try {
            const webpBlob = await convertToWebp(r.file);
            const filename = `${r.id}.webp`;

            if (stickerDirHandle) {
              const fileHandle = await stickerDirHandle.getFileHandle(
                filename,
                { create: true },
              );
              const writable = await fileHandle.createWritable();
              await writable.write(webpBlob);
              await writable.close();
            } else {
              zip.file(filename, webpBlob);
            }

            exec(
              `
        INSERT INTO stickers (id, file, name, primary_category, secondary_category, active, needs_review, artist_id)
        VALUES (?, ?, ?, ?, ?, ?, ?, ?)
      `,
              [
                r.id,
                filename,
                r.name,
                r.primary,
                r.secondary || null,
                r.active ? 1 : 0,
                0,
                r.artist || null,
              ],
            );

            upsertTags(r.id, r.tags);
            succeeded.push(r);
          } catch (err) {
            console.error(`Failed on sticker "${r.id}":`, err);
            failed.push({ id: r.id, message: err.message || String(err) });
          }
        }

        if (zip && succeeded.length) {
          const zipBlob = await zip.generateAsync({ type: "blob" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(zipBlob);
          a.download = "stickers-export.zip";
          document.body.appendChild(a);
          a.click();
          a.remove();
        }

        bulkRows = bulkRows.filter((r) => failed.some((f) => f.id === r.id));
        succeeded.forEach((r) => URL.revokeObjectURL(r.objectUrl));

        loadCaches();
        renderList();

        btn.disabled = false;
        btn.textContent = "Add all to database";

        if (failed.length) {
          renderBulkTable();
          showToast(
            `Saved ${succeeded.length}, failed ${failed.length} — see console, failed rows kept below`,
          );
        } else {
          renderEditForm();
          showToast(
            `Saved ${succeeded.length} sticker(s) — remember to download the .db`,
          );
        }
      }

        renderEditForm();
        showToast(`Updated ${count} sticker(s) — remember to download the .db`);
      }

      function parseAiSuggestion(text, id) {
        let clean = text.trim();
        if (clean.startsWith("```")) {
          clean = clean
            .replace(/^```(json)?/, "")
            .replace(/```$/, "")
            .trim();
        }

        let data;
        try {
          data = JSON.parse(clean);
        } catch (e) {
          throw new Error(`unparseable response: ${clean.slice(0, 120)}`);
        }

        const validCats = new Set([
          ...CATEGORIES.feelings,
          ...CATEGORIES.world,
        ]);
        let needsReview = data.needsReview === true;

        const name =
          typeof data.name === "string" && data.name.trim()
            ? data.name.trim()
            : ((needsReview = true), "");

        const tags = Array.isArray(data.tags)
          ? data.tags
              .map((t) => String(t).trim())
              .filter(Boolean)
              .slice(0, 5)
          : ((needsReview = true), []);

        const primaryCategory = validCats.has(data.primaryCategory)
          ? data.primaryCategory
          : ((needsReview = true), "");

        const secondaryCategory =
          data.secondaryCategory == null
            ? null
            : validCats.has(data.secondaryCategory)
              ? data.secondaryCategory
              : ((needsReview = true), null);

        return {
          id,
          name,
          tags,
          primaryCategory,
          secondaryCategory,
          needsReview,
        };
      }
      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async function fetchStickerImageAsBase64(file) {
        const res = await fetch(`/stickers/${file}`);
        if (!res.ok) throw new Error(`could not load /stickers/${file}`);
        return blobToBase64(await res.blob());
      }

      async function callClaudeForSticker(id, file, oldCategory) {
        const imageB64 = await fetchStickerImageAsBase64(file);

        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": anthropicApiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
          body: JSON.stringify({
            model: "claude-haiku-4-5", // matches MODEL in tag-stickers.py
            max_tokens: 750,
            system: AI_SUGGEST_SYSTEM_PROMPT,
            messages: [
              {
                role: "user",
                content: [
                  {
                    type: "image",
                    source: {
                      type: "base64",
                      media_type: "image/webp",
                      data: imageB64,
                    },
                  },
                  {
                    type: "text",
                    text: `Sticker id: "${id}"\nOLD category (hint only): "${oldCategory || "Unknown"}"`,
                  },
                ],
              },
            ],
          }),
        });

        if (!res.ok) {
          const bodyText = (await res.text()).slice(0, 200);
          const err = new Error(`API ${res.status}: ${bodyText}`);
          err.status = res.status;
          throw err;
        }

        const data = await res.json();
        const text = data.content
          .filter((b) => b.type === "text")
          .map((b) => b.text)
          .join("");

        try {
          return parseAiSuggestion(text, id);
        } catch (parseErr) {
          // Only truly unparseable JSON reaches here now. One cheap
          // text-only repair pass (no image resend) before giving up.
          const repairRes = await fetch(
            "https://api.anthropic.com/v1/messages",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-api-key": anthropicApiKey,
                "anthropic-version": "2023-06-01",
                "anthropic-dangerous-direct-browser-access": "true",
              },
              body: JSON.stringify({
                model: "claude-haiku-4-5",
                max_tokens: 750,
                system:
                  "Return ONLY the corrected JSON object, no markdown fences, no other text.",
                messages: [
                  {
                    role: "user",
                    content: `This response was supposed to be a single JSON object but failed to parse:\n\n${text}\n\nFix it and return only valid JSON matching the same fields.`,
                  },
                ],
              }),
            },
          );

          if (!repairRes.ok) throw parseErr;

          const repairData = await repairRes.json();
          const repairText = repairData.content
            .filter((b) => b.type === "text")
            .map((b) => b.text)
            .join("");
          return parseAiSuggestion(repairText, id);
        }
      }

      async function suggestSelectedWithAI() {
        const status = $("aiSuggestStatus");
        const selected = bulkEditRows.filter((r) => r.selected);

        if (!anthropicApiKey) {
          showToast("Enter an Anthropic API key first");
          return;
        }
        if (!selected.length) {
          showToast("Select at least one sticker first");
          return;
        }

        const btn = $("aiSuggestBtn");
        btn.disabled = true;
        let ok = 0,
          failed = 0,
          flagged = 0,
          stoppedEarly = false;

        for (let i = 0; i < selected.length; i++) {
          const r = selected[i];
          if (status)
            status.textContent = `[${i + 1}/${selected.length}] ${r.id} ...`;

          try {
            const s = await callClaudeForSticker(r.id, r.file, r.primary);
            if (s.name) r.name = s.name;
            if (s.tags.length) r.tags = s.tags.join(", ");
            if (s.primaryCategory) r.primary = s.primaryCategory;
            if (s.secondaryCategory !== null) r.secondary = s.secondaryCategory;
            r.needsReview = s.needsReview;
            if (s.needsReview) flagged++;
            ok++;
          } catch (err) {
            console.error(`AI suggest failed for "${r.id}":`, err);
            failed++;

            if (/credit balance|insufficient/i.test(err.message)) {
              stoppedEarly = true;
              break;
            }
          }

          await new Promise((resolve) => setTimeout(resolve, 300));
        }

        btn.disabled = false;
        renderBulkEditTable();

        if (stoppedEarly) {
          const remaining = selected.length - ok - failed;
          showToast(
            `Stopped — Anthropic account is out of credits. ${ok} done, ${remaining} not attempted — review before saving`,
          );
        } else {
          showToast(
            `AI suggestions: ${ok} done (${flagged} flagged for review), ${failed} failed`,
          );
        }
      }

      function downloadDb() {
        const data = db.export();
        const blob = new Blob([data], { type: "application/octet-stream" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = loadedFileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("Downloaded");
      }

      async function handleFile(file) {
        loadedFileName = file.name;
        const buf = await file.arrayBuffer();
        db = new SQL.Database(new Uint8Array(buf));

        ensureArtistSchema();
        loadCaches();
        populateCategoryFilter();
        populateArtistFilter();
        renderList();

        document.getElementById("dropzone").style.display = "none";
        document.getElementById("app").classList.add("visible");
        document.getElementById("addStickerBtn").disabled = false;
        document.getElementById("manageArtistsBtn").disabled = false;
        document.getElementById("bulkImportBtn").disabled = false;
        document.getElementById("downloadBtn").disabled = false;
      }

      $("fileInput").addEventListener("change", (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
      });

      $("sidebarToggleBtn").addEventListener("click", () => {
        const sidebar = $("stickerSidebar");
        const button = $("sidebarToggleBtn");
        const isCollapsed = sidebar.classList.toggle("collapsed");
        const label = isCollapsed
          ? "Expand sticker selector"
          : "Collapse sticker selector";

        button.textContent = isCollapsed ? "›" : "‹";
        button.setAttribute("aria-expanded", String(!isCollapsed));
        button.setAttribute("aria-label", label);
        button.title = label;
      });

      $("searchInput").addEventListener("input", renderList);
      [$("scopeNameBtn"), $("scopeTagsBtn")].forEach((btn) => {
        btn.addEventListener("click", () => {
          const scope = btn.dataset.scope;
          const isActive = btn.classList.toggle("active");
          btn.setAttribute("aria-pressed", String(isActive));
          if (isActive) searchScopes.add(scope);
          else searchScopes.delete(scope);
          renderList();
        });
      });
      $("tabFilter").addEventListener("change", () => {
        populateCategoryFilter();
        const currentTab = $("tabFilter").value;
        if (currentTab) {
          const sel = $("categoryFilter");
          sel.innerHTML =
            `<option value="">All categories</option>` +
            CATEGORIES[currentTab]
              .map((c) => `<option value="${c}">${c}</option>`)
              .join("");
        }
        renderList();
      });
      $("categoryFilter").addEventListener("change", renderList);
      $("statusFilter").addEventListener("change", renderList);
      $("artistFilter").addEventListener("change", renderList);

      $("addStickerBtn").addEventListener("click", renderAddForm);
      $("manageArtistsBtn").addEventListener("click", renderArtistPanel);
      $("bulkImportBtn").addEventListener("click", renderBulkImportView);
      $("bulkEditSelectedBtn").addEventListener("click", renderBulkEditView);

      $("selectAllVisibleCheck").addEventListener("change", (e) => {
        if (e.target.checked) {
          visibleStickerIds.forEach((id) => bulkEditIds.add(id));
        } else {
          visibleStickerIds.forEach((id) => bulkEditIds.delete(id));
        }
        renderList();
        updateBulkEditButton();
      });

      $("clearBulkEditBtn").addEventListener("click", () => {
        bulkEditIds.clear();
        renderList();
        updateBulkEditButton();
      });
      $("downloadBtn").addEventListener("click", downloadDb);

      initSql();

      window.addEventListener("beforeunload", (e) => {
        if (db) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
    </script>
  </body>
