  <body>
    <!-- Hidden SEO Content -->
    <!-- <div style="display: none">
      Daily Sticky is a digital sticker journal and daily sticker diary for
      people who want an easy, visual way to remember their year. Choose one
      sticker a day to track your mood, moments, habits, memories, and little
      life updates. It's a simple alternative to journaling, like a year in
      pixels or visual mood tracker, but with cute stickers instead of colors.

    <header class="topbar">
      <div class="title">
        <img
          src="the-daily-sticky-logo.png"
          alt="The Daily Sticky — a sticker journal for your year"
          class="site-logo"
        />
        <p class="subtitle">tap a day → choose a sticker → done</p>
      </div>

      <div class="controls">
        <div class="nav-stack">
          <div class="navigate">
            <button id="prevBtn" class="btn">◀</button>
            <button id="todayBtn" class="btn">Today</button>
            <button id="nextBtn" class="btn">▶</button>
          </div>

          <button id="toggleViewBtn" class="btn btn-primary">Year view</button>
        </div>

        <div class="topbar-actions">
          <button
            id="shareWeekBtn"
            class="btn icon-btn"
            aria-label="Share week"
          >
            <i class="fa-solid fa-share-nodes"></i>
          </button>

          <button id="menuBtn" class="btn icon-btn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </div>

      <div class="controls secondary" id="secondaryControls">
        <select id="monthSelect" class="select" aria-label="Month"></select>
        <select id="yearSelect" class="select" aria-label="Year"></select>
      </div>
    </header>

    <div id="menuDropdown" class="menu-dropdown hidden" role="menu">
      <a id="menuAbout" class="menu-item" href="/about.html">About</a>
      <a class="menu-item" href="/blog/">Sticky Notes</a>
      <button id="menuExport" class="menu-item">Export Backup</button>
      <label class="menu-item fileBtn">
        Import Backup
        <input
          id="menuImportInput"
          type="file"
          accept="application/json"
          hidden
        />
      </label>
    </div>

    <main class="container">
      <section id="monthView" class="view"></section>
      <section id="yearView" class="view hidden"></section>
    </main>

    <!-- Sticker Picker Modal -->
    <div
      id="modalOverlay"
      class="overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Sticker picker"
    >
      <div class="modal">
        <div class="modalHeader">
          <div>
            <div class="modalDateRow">
              <div id="modalDate" class="modalDate">Date</div>
              <button id="removeStickerBtn" class="btn">Remove Sticker</button>
            </div>

            <div class="modalHint">Choose a sticker (1 per day)</div>
          </div>

          <div class="modalHeaderActions">
            <button id="noteBtn" class="btn">Add Note</button>
            <button id="closeModalBtn" class="btn">✕</button>
          </div>
        </div>

        <div id="stickerGrid" class="grid"></div>
      </div>

      <div class="modalTools">
        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Search stickers (e.g., cat, coffee, book)"
        />
      </div>
    </div>

    <!-- Note Modal -->
    <div
      id="noteOverlay"
      class="overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Day note"
    >
      <div class="modal noteModal">
        <div class="modalHeader">
          <div>
            <div id="noteModalDate" class="modalDate">Date</div>
            <div class="modalHint">Add a short note</div>
          </div>

          <button id="closeNoteModalBtn" class="btn">✕</button>
        </div>

        <textarea
          id="noteInput"
          class="noteInput"
          maxlength="160"
          rows="5"
          placeholder="Write a short note..."
        ></textarea>

        <div class="noteFooter">
          <div id="noteCount" class="small">0/160</div>

          <div class="noteActions">
            <button id="deleteNoteBtn" class="btn">Delete Note</button>
            <button id="saveNoteBtn" class="btn btn-primary">Save Note</button>
          </div>
        </div>
      </div>
    </div>

    <div id="weeklyShareCard" class="weekly-share-card" aria-hidden="true">
      <div class="title">
        <img
          src="mwis.png"
          alt="The Daily Sticky — a sticker journal for your year"
          class="share-site-logo"
        />
      </div>
      <!-- <div class="weekly-share-range" id="weeklyShareRange"></div> -->

      <div id="weeklyShareGrid" class="weekly-share-grid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="app.js"></script>
